function oggiISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addGiorni(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

let dataCorrente = oggiISO();
let arrivi = [];

document.getElementById('data-input').value = dataCorrente;
document.getElementById('data-input').addEventListener('change', function(){
  dataCorrente = this.value || oggiISO();
  carica();
});
function cambiaData(delta) { dataCorrente = addGiorni(dataCorrente, delta); document.getElementById('data-input').value = dataCorrente; carica(); }

let scanPin = sessionStorage.getItem('scansione_pin') || '';

function chiudiOverlay() {
  if (webcamStream) { webcamStream.getTracks().forEach(function(t){ t.stop(); }); webcamStream = null; }

async function carica() {
  if (!scanPin) { mostraPromptPin(); return; }
  await caricaConPin(scanPin);
}

function mostraPromptPin(messaggioErrore) {
  chiudiOverlay();
  const div = document.createElement('div');
  div.id = 'scan-overlay';
  div.className = 'overlay';
  div.innerHTML =
    '<div class="modalbox">' +
      '<h3>🔒 Inserisci la password</h3>' +
      (messaggioErrore ? '<div class="err">'+messaggioErrore+'</div>' : '') +
      '<input type="password" id="pin-input" placeholder="Password" autofocus>' +
      '<button class="wide btn-ok" onclick="confermaPin()">Conferma</button>' +
    '</div>';
  document.body.appendChild(div);
  const inp = document.getElementById('pin-input');
  inp.focus();
  inp.addEventListener('keydown', function(e){ if (e.key==='Enter') confermaPin(); });
}
function confermaPin() {
  const pin = (document.getElementById('pin-input')||{value:''}).value.trim();
  if (!pin) return;
  caricaConPin(pin);
}

async function caricaConPin(pin) {
  document.getElementById('content').innerHTML = '<div class="loading">Caricamento…</div>';
  try {
    const { data, error } = await sb.rpc('scansione_lista_arrivi', { p_data: dataCorrente, p_pin: pin });
    if (error) {
      sessionStorage.removeItem('scansione_pin');
      mostraPromptPin('Password errata, riprova.');
      return;
    }
    scanPin = pin;
    sessionStorage.setItem('scansione_pin', pin);
    chiudiOverlay();
    arrivi = data || [];
    render();
  } catch (err) {
    mostraPromptPin('Errore di connessione, riprova.');
  }
}

function render() {
  const el = document.getElementById('content');
  if (!arrivi.length) {
    el.innerHTML = '<div class="empty">Nessun arrivo per questa data.</div>';
    return;
  }
  el.innerHTML = arrivi.map(roomCardHTML).join('');
}

function roomCardHTML(a) {
  const componenti = a.componenti || [];
  let righe = '';
  for (let i = 0; i < a.persone; i++) {
    const c = componenti[i] || {};
    const completo = !!(c.cognome && c.nome);
    const nomeVisualizzato = completo ? (c.cognome+' '+c.nome) : ('Ospite '+(i+1));
    righe += '<div class="guestrow">' +
      (c.fotoOspite ? '<img class="thumb" src="'+c.fotoOspite+'">' : '<div class="thumb empty">👤</div>') +
      '<div class="info"><div class="name">'+nomeVisualizzato+'</div>' +
        '<div class="status '+(completo?'ok':'no')+'">'+(completo?'✅ Documento acquisito':'⚠ Da scansionare')+'</div></div>' +
      '<button onclick="apriScansione(\''+a.booking_id+'\','+i+')">'+(completo?'🔁 Rifai':'📷 Scansiona')+'</button>' +
    '</div>';
  }
  return '<div class="roomcard">' +
    '<div class="head"><div><span class="room">'+a.room_name+'</span><span class="type">'+(a.room_type||'')+'</span></div><span class="count">'+a.persone+' ospit'+(a.persone===1?'e':'i')+'</span></div>' +
    righe +
  '</div>';
}

/* ============================================================
   SCANSIONE — stessa logica di lettura MRZ già usata dentro DeskFlow
   (Tesseract.js OCR + parsing carta d'identità/passaporto)
   ============================================================ */
function mrzCharVal(c) {
  if (c>='0'&&c<='9') return c.charCodeAt(0)-48;
  if (c>='A'&&c<='Z') return c.charCodeAt(0)-55;
  return 0;
}
function mrzChecksum(str) {
  const pesi=[7,3,1]; let s=0;
  for (let k=0;k<str.length;k++) s += mrzCharVal(str[k]) * pesi[k%3];
  return s%10;
}
function mrzDateToISO(yymmdd) {
  if (!/^\d{6}$/.test(yymmdd)) return '';
  const yy=parseInt(yymmdd.slice(0,2),10), mm=yymmdd.slice(2,4), dd=yymmdd.slice(4,6);
  const nowYY = new Date().getFullYear()%100;
  const secolo = (yy > nowYY+10) ? 1900 : 2000;
  return (secolo+yy)+'-'+mm+'-'+dd;
}
function mrzParseNome(campo) {
  const parti = campo.split('<<');
  const cognome = (parti[0]||'').replace(/</g,' ').trim();
  const nome = (parti[1]||'').replace(/</g,' ').trim();
  return {cognome:cognome, nome:nome};
}
function mrzTryTD3(l1, l2) {
  if (l1.length<40 || l2.length<40 || l1[0]!=='P') return null;
  l1 = (l1+'<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0,44);
  l2 = (l2+'<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0,44);
  const paese = l1.slice(2,5).replace(/</g,'');
  const {cognome, nome} = mrzParseNome(l1.slice(5));
  const numDoc = l2.slice(0,9).replace(/</g,'');
  const nazionalita = l2.slice(10,13).replace(/</g,'');
  const nascita = mrzDateToISO(l2.slice(13,19));
  const sesso = l2[20]==='F' ? 'F' : 'M';
  if (!numDoc || !cognome) return null;
  const okChecksum = mrzChecksum(l2.slice(0,9))===mrzCharVal(l2[9]) || l2[9]==='<';
  return {tipoDoc:'PASOR', paese:paese, cognome:cognome, nome:nome, numDoc:numDoc, nazionalita:nazionalita, dataNascita:nascita, sesso:sesso, affidabile:okChecksum};
}
function mrzTryTD1(l1, l2, l3) {
  if (l1.length<25 || l2.length<25 || l3.length<10) return null;
  if (!/^\d{6}/.test(l2)) return null;
  l1 = (l1+'<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0,30);
  l2 = (l2+'<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0,30);
  l3 = (l3+'<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0,30);
  const paese = l1.slice(2,5).replace(/</g,'');
  const numDoc = l1.slice(5,14).replace(/</g,'');
  const nascita = mrzDateToISO(l2.slice(0,6));
  const sesso = l2[7]==='F' ? 'F' : 'M';
  const nazionalita = l2.slice(15,18).replace(/</g,'');
  const {cognome, nome} = mrzParseNome(l3);
  if (!numDoc || !cognome) return null;
  const okChecksum = mrzChecksum(l1.slice(5,14))===mrzCharVal(l1[14]) || l1[14]==='<';
  return {tipoDoc:'IDELE', paese:paese, cognome:cognome, nome:nome, numDoc:numDoc, nazionalita:nazionalita, dataNascita:nascita, sesso:sesso, affidabile:okChecksum};
}
function mrzEstraiDaTesto(testoGrezzo) {
  const righe = testoGrezzo.split('\n')
    .map(function(r){ return r.toUpperCase().replace(/[^A-Z0-9<]/g,''); })
    .filter(function(r){ return r.length>=20; });
  for (let k=0;k<righe.length-1;k++) { const r = mrzTryTD3(righe[k], righe[k+1]); if (r) return r; }
  for (let k=0;k<righe.length-2;k++) { const r = mrzTryTD1(righe[k], righe[k+1], righe[k+2]); if (r) return r; }
  return null;
}
function comprimiFoto(file) {
  return new Promise(function(resolve){
    try {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        const MAX = 300;
        let w = img.width, h = img.height;
        if (w > h && w > MAX) { h = Math.round(h*MAX/w); w = MAX; }
        else if (h > MAX) { w = Math.round(w*MAX/h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(''); };
      img.src = url;
    } catch(e) { resolve(''); }
  });
}

let scanCorrente = { bookingId:'', index:0, dati:null, foto:'' };

function apriScansione(bookingId, index) {
  scanCorrente = { bookingId, index, dati:null, foto:'' };
  chiudiOverlay();
  const div = document.createElement('div');
  div.id = 'scan-overlay';
  div.className = 'overlay';
  div.innerHTML =
    '<div class="modalbox">' +
      '<h3>📷 Scansiona documento</h3>' +
      '<p style="font-size:12.5px;color:#6b7280;margin-top:-6px">Fotografa le righe in basso sul documento (carta d\'identità elettronica o passaporto).</p>' +
      '<input type="file" id="scan-file-input" accept="image/*" capture="environment" style="display:none" onchange="onFotoScattata(this.files[0])">' +
      '<button class="wide btn-scan" onclick="document.getElementById(\'scan-file-input\').click()">📷 Fotocamera del telefono</button>' +
      '<button class="wide btn-scan" style="background:#374151;margin-top:8px" onclick="apriWebcam()">🎥 Usa la webcam del PC</button>' +
      '<div id="scan-webcam-area"></div>' +
      '<div id="scan-risultato"></div>' +
      '<button class="wide btn-cancel" onclick="chiudiOverlay()" style="margin-top:10px">Annulla</button>' +
    '</div>';
  document.body.appendChild(div);
}

let webcamStream = null;
async function apriWebcam() {
  const area = document.getElementById('scan-webcam-area');
  if (!area) return;
  try {
    // Chiediamo la risoluzione più alta possibile — le webcam dei PC di default spesso partono a
    // risoluzione bassa, che rende il testo piccolo della striscia del documento poco leggibile per
    // il riconoscimento automatico. "ideal" chiede il massimo che la webcam sa dare, senza bloccare
    // se non lo supporta.
    webcamStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
  } catch (err) {
    area.innerHTML = '<div class="affidabilita no">Non riesco ad accedere alla webcam: '+(err.message||'permesso negato')+'</div>';
    return;
  }
  area.innerHTML =
    '<video id="scan-webcam-video" autoplay playsinline style="width:100%;border-radius:8px;margin:10px 0;background:#000"></video>' +
    '<p style="font-size:12px;color:#6b7280;margin:-4px 0 8px">Avvicina il documento fino a riempire bene l\'inquadratura, poi scatta.</p>' +
    '<button class="wide btn-scan" onclick="scattaDaWebcam()">📸 Scatta foto</button>';
  document.getElementById('scan-webcam-video').srcObject = webcamStream;
}
function chiudiWebcam() {
  if (webcamStream) { webcamStream.getTracks().forEach(function(t){ t.stop(); }); webcamStream = null; }
  const area = document.getElementById('scan-webcam-area');
  if (area) area.innerHTML = '';
}
function scattaDaWebcam() {
  const video = document.getElementById('scan-webcam-video');
  if (!video) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  chiudiWebcam();
  canvas.toBlob(function(blob){ onFotoScattata(blob); }, 'image/jpeg', 0.92);
}

async function onFotoScattata(file) {
  const risultatoDiv = document.getElementById('scan-risultato');
  risultatoDiv.innerHTML = '<p style="text-align:center;color:#6b7280;font-size:13px;padding:14px 0">Lettura in corso…</p>';

  const fotoPromise = comprimiFoto(file);

  try {
    const result = await Tesseract.recognize(file, 'eng', { tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<' });
    const dati = mrzEstraiDaTesto(result.data.text || '');
    const foto = await fotoPromise;
    scanCorrente.foto = foto;

    if (!dati) {
      risultatoDiv.innerHTML =
        '<div class="affidabilita no">⚠️ Non sono riuscito a leggere il documento. Riprova fotografando bene le righe in basso, oppure compila a mano.</div>' +
        (foto ? '<img class="preview-photo" src="'+foto+'">' : '') +
        formularioManualeHTML({});
      return;
    }
    scanCorrente.dati = dati;
    risultatoDiv.innerHTML =
      '<div class="affidabilita '+(dati.affidabile?'ok':'no')+'">'+(dati.affidabile?'✅ Documento letto — controlla i dati prima di salvare':'⚠️ Documento letto, ma non perfettamente — ricontrolla bene i dati')+'</div>' +
      (foto ? '<img class="preview-photo" src="'+foto+'">' : '') +
      formularioManualeHTML(dati);
  } catch (err) {
    console.error(err);
    risultatoDiv.innerHTML = '<div class="affidabilita no">Errore nella lettura: '+(err.message||'sconosciuto')+'</div>' + formularioManualeHTML({});
  }
}

function formularioManualeHTML(d) {
  return '<div class="field row2">' +
      '<div><label>Cognome</label><input type="text" id="f-cognome" value="'+(d.cognome||'')+'"></div>' +
      '<div><label>Nome</label><input type="text" id="f-nome" value="'+(d.nome||'')+'"></div>' +
    '</div>' +
    '<div class="field row2">' +
      '<div><label>Sesso</label><select id="f-sesso"><option value="M" '+(d.sesso!=='F'?'selected':'')+'>M</option><option value="F" '+(d.sesso==='F'?'selected':'')+'>F</option></select></div>' +
      '<div><label>Data di nascita</label><input type="date" id="f-nascita" value="'+(d.dataNascita||'')+'"></div>' +
    '</div>' +
    '<div class="field row2">' +
      '<div><label>Tipo documento</label><select id="f-tipodoc">' +
        '<option value="IDELE" '+(d.tipoDoc==='IDELE'?'selected':'')+'>Carta d\'identità</option>' +
        '<option value="PASOR" '+(d.tipoDoc==='PASOR'?'selected':'')+'>Passaporto</option>' +
        '<option value="PATEN" '+(d.tipoDoc==='PATEN'?'selected':'')+'>Patente</option>' +
      '</select></div>' +
      '<div><label>N. documento</label><input type="text" id="f-numdoc" value="'+(d.numDoc||'')+'"></div>' +
    '</div>' +
    '<button class="wide btn-ok" onclick="salvaScansione()">💾 Salva</button>';
}

async function salvaScansione() {
  const cognome = (document.getElementById('f-cognome')||{value:''}).value.trim();
  const nome = (document.getElementById('f-nome')||{value:''}).value.trim();
  if (!cognome || !nome) { alert('Cognome e nome sono obbligatori.'); return; }
  const dati = {
    cognome: cognome,
    nome: nome,
    sesso: (document.getElementById('f-sesso')||{value:'M'}).value,
    dataNascita: (document.getElementById('f-nascita')||{value:''}).value,
    tipoDoc: (document.getElementById('f-tipodoc')||{value:''}).value,
    numDoc: (document.getElementById('f-numdoc')||{value:''}).value,
    fotoOspite: scanCorrente.foto || ''
  };
  try {
    const { error } = await sb.rpc('scansione_salva_ospite', {
      p_booking_id: scanCorrente.bookingId, p_pin: scanPin, p_index: scanCorrente.index, p_dati: dati
    });
    if (error) throw error;
    chiudiOverlay();
    carica();
  } catch (err) {
    alert('Salvataggio non riuscito: ' + (err.message||'errore sconosciuto'));
  }
}

carica();
</script>
