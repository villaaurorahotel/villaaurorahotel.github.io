<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guida ospiti — Hotel Villa Aurora</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232d7fb8'/%3E%3Ctext x='12' y='17' font-size='15' text-anchor='middle'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--sky:#e8f4fd;--sky2:#c8e6f7;--sky3:#a0d0ef;--sky4:#5ba8d4;--sky5:#2d7fb8;--deep:#1a4f72;--white:#fff;--sand:#f7f3ee;--gtext:#1e3a4f;--muted:#5a7a8a;--wave:#e0f2fe}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand);font-family:'DM Sans',sans-serif;color:var(--gtext)}
  .wrap{max-width:760px;margin:0 auto;padding:1.5rem 1rem 3rem;font-family:'DM Sans',sans-serif;color:var(--gtext)}
  .hero{background:linear-gradient(160deg,var(--sky) 0%,var(--sky2) 50%,var(--sky3) 100%);border-radius:20px;padding:2.5rem 2rem 2rem;text-align:center;margin-bottom:1.5rem}
  .hero h1{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:400;color:var(--deep);margin:.5rem 0 .3rem}
  .hero .sub{font-size:.82rem;color:var(--sky5);letter-spacing:.12em;text-transform:uppercase;font-weight:500}
  .hero-icon{font-size:2rem;display:block}
  .card{background:var(--white);border:1px solid var(--sky2);border-radius:16px;margin-bottom:1.1rem;overflow:hidden}
  .card-head{background:linear-gradient(90deg,var(--sky),var(--wave));padding:.85rem 1.2rem;display:flex;align-items:center;gap:.6rem}
  .card-icon{font-size:1.1rem}
  .card-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:500;color:var(--deep);flex:1}
  .card-body{padding:1.1rem 1.2rem}
  .field-group{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.4rem}
  @media(max-width:500px){.field-group{grid-template-columns:1fr}}
  .field{background:var(--sky);border-radius:10px;padding:.6rem .9rem}
  .field label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sky5);font-weight:500}
  .field .val{font-size:.88rem;color:var(--deep)}
  .tip-field{background:linear-gradient(135deg,var(--sky),#f0faff);border-left:3px solid var(--sky4);border-radius:0 10px 10px 0;padding:.75rem 1rem;margin:.5rem 0;display:flex;align-items:flex-start;gap:.5rem;font-size:.86rem;line-height:1.55}
  .contacts-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  @media(max-width:480px){.contacts-grid{grid-template-columns:1fr}}
  .contact-chip{background:var(--sky);border:1px solid var(--sky2);border-radius:10px;padding:.6rem .8rem;display:flex;align-items:flex-start;gap:.45rem}
  .contact-chip .ci{font-size:1.1rem;line-height:1.4}
  .contact-chip .cc-label{font-size:.66rem;font-weight:500;color:var(--sky5);text-transform:uppercase;letter-spacing:.07em;display:block}
  .contact-chip .cc-main{font-size:.85rem;color:var(--deep);display:block;margin-top:.15rem}
  .contact-chip .cc-sub{font-size:.76rem;color:var(--muted);font-style:italic;margin-top:.3rem;display:block}
  .item-row{display:flex;gap:.75rem;align-items:flex-start;padding:.75rem 0;border-bottom:1px solid var(--sky)}
  .item-row:last-of-type{border-bottom:none}
  .item-dot{width:34px;height:34px;min-width:34px;background:var(--sky2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem}
  .item-name{font-weight:500;font-size:.9rem;color:var(--deep)}
  .item-desc{font-size:.81rem;color:var(--muted);line-height:1.5;margin-top:.15rem}
  .item-dist{font-size:.73rem;color:var(--sky4);font-weight:500;margin-top:.25rem}
  .rule-row{display:flex;align-items:flex-start;gap:.5rem;padding:.4rem 0;font-size:.86rem;line-height:1.55}
  .appliance-card{background:var(--white);border:1px solid var(--sky2);border-radius:12px;padding:.85rem 1rem;margin-bottom:.7rem}
  .appliance-name{font-weight:600;font-size:.92rem;color:var(--deep);cursor:pointer;display:flex;align-items:center;gap:.4rem}
  .appliance-name .ch{font-size:1.2rem;color:var(--sky5);font-weight:700;transition:transform .2s;margin-left:auto}
  .appliance-body{display:none;margin-top:.6rem}
  .appliance-card.open .appliance-body{display:block}
  .appliance-card.open .ch{transform:rotate(180deg)}
  .appliance-instr-txt{font-size:.85rem;color:var(--gtext);line-height:1.6;white-space:pre-wrap}
  .appliance-photos-view{display:flex;flex-wrap:wrap;gap:8px;margin-top:.6rem}
  .appliance-photos-view img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--sky2);cursor:pointer}
  .lightbox{position:fixed;inset:0;background:rgba(10,30,45,.9);display:none;align-items:center;justify-content:center;z-index:999;padding:1rem}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:10px}
  .wave{text-align:center;color:var(--sky3);letter-spacing:.3em;padding:.4rem 0}
  .footer-txt{text-align:center;font-size:.76rem;font-style:italic;color:var(--muted);margin-top:.5rem}
  .loading,.err{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="guide">
  <div class="loading">Caricamento della guida…</div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightbox-img" src="" alt="">
</div>
<script>
// Progetto Supabase di Hotel Villa Aurora — pagina pubblica di sola lettura, nessun login richiesto.
var SB_URL = 'https://surkplkjhrnheulzfaxv.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmtwbGtqaHJuaGV1bHpmYXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MjQwNTcsImV4cCI6MjA5OTQwMDA1N30.4wmz67Xj38f6DfeVCZx6zBrQjOPIWqs2yUGHpVwXucs';

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fieldHTML(f){ return '<div class="field"><label>'+esc(f.label)+'</label><div class="val">'+esc(f.value)+'</div></div>'; }
function contactHTML(c){
  return '<div class="contact-chip"><span class="ci">'+esc(c.icon||'📞')+'</span><div><span class="cc-label">'+esc(c.label)+'</span><span class="cc-main">'+esc(c.main)+'</span>'+(c.sub?'<span class="cc-sub">'+esc(c.sub)+'</span>':'')+'</div></div>';
}
function itemHTML(it){
  return '<div class="item-row"><div class="item-dot">'+esc(it.emoji||'📍')+'</div><div><div class="item-name">'+esc(it.name)+'</div><div class="item-desc">'+esc(it.desc)+'</div><div class="item-dist">'+esc(it.dist)+'</div></div></div>';
}
function ruleHTML(r){ return '<div class="rule-row"><span>'+esc(r.icon||'📝')+'</span><span>'+esc(r.text)+'</span></div>'; }
function applianceHTML(a, idx){
  var fotoHTML = (a.photos||[]).map(function(src){
    return '<img src="'+src+'" onclick="apriLightbox(\''+src+'\')" alt="'+esc(a.name)+'">';
  }).join('');
  return '<div class="appliance-card" id="app-'+idx+'">'+
    '<div class="appliance-name" onclick="toggleAppliance('+idx+')">'+esc(a.name)+'<span class="ch">▼</span></div>'+
    '<div class="appliance-body">'+
      (a.instructions ? '<div class="appliance-instr-txt">'+esc(a.instructions)+'</div>' : '')+
      (fotoHTML ? '<div class="appliance-photos-view">'+fotoHTML+'</div>' : '')+
    '</div></div>';
}
function toggleAppliance(idx){ document.getElementById('app-'+idx).classList.toggle('open'); }
function apriLightbox(src){
  var lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.classList.add('open');
}
function sectionHTML(icon, title, inner){
  return '<div class="card"><div class="card-head"><span class="card-icon">'+icon+'</span><span class="card-title">'+title+'</span></div><div class="card-body">'+inner+'</div></div>';
}

async function carica(){
  var el = document.getElementById('guide');
  try {
    var res = await fetch(SB_URL + '/rest/v1/app_blobs?select=data&key=eq.guidaOspiti', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    if (!res.ok) throw new Error('Risposta ' + res.status);
    var rows = await res.json();
    var d = (rows && rows[0] && rows[0].data) || null;
    if (!d) { el.innerHTML = '<div class="err">Guida non ancora disponibile — riprova più tardi o contatta la struttura.</div>'; return; }

    var html = '';
    html += '<div class="hero"><span class="hero-icon">🏡</span><h1>Benvenuti a Greta\'s House</h1><p class="sub">San Martino di Castrozza · Trentino</p></div>';
    if (d.address) html += '<div class="tip-field" style="margin-bottom:1.2rem">📍 '+esc(d.address)+'</div>';
    html += sectionHTML('🌊','Messaggio di benvenuto','<div class="tip-field">'+esc(d.welcome).replace(/\n/g,'<br>')+'</div>');
    html += sectionHTML('🏠','La struttura', '<div class="field-group">'+(d.info||[]).map(fieldHTML).join('')+'</div>');
    if ((d.appliances||[]).length) html += sectionHTML('🔌','Elettrodomestici e comfort', d.appliances.map(applianceHTML).join(''));
    if ((d.contacts||[]).length) html += sectionHTML('📞','Contatti utili', '<div class="contacts-grid">'+d.contacts.map(contactHTML).join('')+'</div>');
    if ((d.rest||[]).length) html += sectionHTML('🍽️','Ristoranti consigliati', d.rest.map(itemHTML).join(''));
    if ((d.beach||[]).length) html += sectionHTML('🏖️','Spiagge e mare', d.beach.map(itemHTML).join(''));
    if ((d.visit||[]).length) html += sectionHTML('🗺️','Luoghi da visitare', d.visit.map(itemHTML).join(''));
    if ((d.act||[]).length) html += sectionHTML('🌞','Esperienze e attività', d.act.map(itemHTML).join(''));
    if ((d.rules||[]).length) html += sectionHTML('📋','Note e regole della casa', d.rules.map(ruleHTML).join(''));
    html += '<div class="wave">〜 〜 〜</div>';
    if (d.footer) html += '<div class="footer-txt">'+esc(d.footer)+'</div>';

    el.innerHTML = html;
  } catch (err) {
    console.error(err);
    el.innerHTML = '<div class="err">Non è stato possibile caricare la guida in questo momento — controlla la connessione e ricarica la pagina.</div>';
  }
}
carica();
</script>
</body>
</html>
