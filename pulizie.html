<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pulizie — Hotel Villa Aurora</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231a73e8'/%3E%3Ctext x='12' y='17' font-size='15' text-anchor='middle'%3E%F0%9F%A7%B9%3C/text%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulizie">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f4f6fa; color:#1a1a1a; }
  .top { background:#1a73e8; color:#fff; padding:16px 16px 14px; }
  .top h1 { margin:0; font-size:19px; font-weight:800; }
  .top .sub { font-size:12.5px; opacity:.85; margin-top:2px; }
  .datebar { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .datebar input[type=date] { flex:1; padding:8px 10px; border-radius:8px; border:none; font-size:14px; }
  .datebar button { background:rgba(255,255,255,.22); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:14px; font-weight:700; cursor:pointer; }
  .counts { display:flex; gap:10px; padding:14px 16px 0; }
  .catcounts { display:flex; gap:8px; padding:14px 16px 0; overflow-x:auto; }
  .catchip { flex:none; display:flex; align-items:center; gap:6px; background:#fff; border:1px solid #e5e9f0; border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:700; white-space:nowrap; }
  .catchip.arrivo { color:#166534; }
  .catchip.partenza { color:#9a3412; }
  .catchip.fermata { color:#4b5563; }
  .catchip.libere { color:#1d4ed8; }
  .count { flex:1; border-radius:10px; padding:12px; text-align:center; }
  .count.red { background:#fee2e2; color:#b91c1c; }
  .count.green { background:#dcfce7; color:#166534; }
  .count .n { font-size:24px; font-weight:800; }
  .count .l { font-size:11.5px; font-weight:600; }
  .tabs { display:flex; gap:6px; padding:14px 16px 0; overflow-x:auto; }
  .tab { flex:none; padding:8px 13px; border-radius:20px; border:1px solid #dbe2ea; background:#fff; color:#374151; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .tab.active { background:#1a73e8; border-color:#1a73e8; color:#fff; }
  .filterrow { display:flex; align-items:center; gap:8px; padding:12px 16px 0; font-size:13px; color:#4b5563; }
  .content { padding:14px 16px 40px; max-width:520px; margin:0 auto; }
  .sectiontitle { font-size:13px; font-weight:700; margin:16px 0 8px; }
  .card { background:#fff; border:1px solid #e5e9f0; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .card.done { opacity:.6; }
  .card .head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .card .room { font-size:17px; font-weight:800; }
  .card .type { font-size:12px; font-weight:500; color:#8a93a3; margin-left:4px; }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.arrivo { background:#dcfce7; color:#166534; }
  .badge.partenza { background:#ffedd5; color:#9a3412; }
  .badge.fermata { background:#eef1f5; color:#4b5563; }
  .row { font-size:13.5px; color:#374151; margin-bottom:4px; }
  .row b { color:#1a1a1a; }
  .note { font-size:13px; color:#6b7280; background:#f7f8fa; border-radius:8px; padding:8px 10px; margin:8px 0; }
  .toggle { width:100%; padding:14px; font-size:16px; font-weight:700; border-radius:10px; border:none; cursor:pointer; margin-top:6px; }
  .toggle.todo { background:#fee2e2; color:#b91c1c; }
  .toggle.done { background:#16a34a; color:#fff; }
  .empty { color:#9aa2b0; font-size:13.5px; padding:10px 0 4px; }
  .loading { text-align:center; padding:40px 0; color:#9aa2b0; font-size:14px; }
</style>
</head>
<body>

<div class="top">
  <h1>🧹 Pulizie</h1>
  <div class="sub">Hotel Villa Aurora</div>
  <div class="datebar">
    <button onclick="cambiaData(-1)">‹</button>
    <input type="date" id="data-input">
    <button onclick="cambiaData(1)">›</button>
    <button onclick="vaiOggi()">Oggi</button>
  </div>
</div>

<div class="catcounts" id="catcounts"></div>

<div class="counts">
  <div class="count red"><div class="n" id="count-da-pulire">–</div><div class="l">Da pulire</div></div>
  <div class="count green"><div class="n" id="count-pronte">–</div><div class="l">Pronte</div></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="filterrow">
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
    <input type="checkbox" id="solo-da-pulire" onchange="render()"> Mostra solo le camere da pulire
  </label>
</div>

<div class="content" id="content"><div class="loading">Caricamento…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIGURAZIONE — stessi valori già usati in prenota.html
   ============================================================ */
const SUPABASE_URL = 'https://surkplkjhrnheulzfaxv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmtwbGtqaHJuaGV1bHpmYXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MjQwNTcsImV4cCI6MjA5OTQwMDA1N30.4wmz67Xj38f6DfeVCZx6zBrQjOPIWqs2yUGHpVwXucs';
/* ============================================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function oggiISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addGiorni(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDataIt(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', { weekday:'short', day:'numeric', month:'short' });
}

let dataCorrente = oggiISO();
let filtro = 'tutti'; // tutti | arrivo | partenza | fermata
let righe = [];
let nLibere = 0;

document.getElementById('data-input').value = dataCorrente;
document.getElementById('data-input').addEventListener('change', function(){
  dataCorrente = this.value || oggiISO();
  carica();
});

function cambiaData(delta) { dataCorrente = addGiorni(dataCorrente, delta); document.getElementById('data-input').value = dataCorrente; carica(); }
function vaiOggi() { dataCorrente = oggiISO(); document.getElementById('data-input').value = dataCorrente; carica(); }

function renderTabs() {
  const defs = [
    ['tutti','Tutti'],
    ['arrivo','🆕 Arrivi'],
    ['partenza','🚪 Partenze'],
    ['fermata','🛏 Ferme'],
  ];
  document.getElementById('tabs').innerHTML = defs.map(function(d){
    return '<div class="tab'+(filtro===d[0]?' active':'')+'" onclick="impostaFiltro(\''+d[0]+'\')">'+d[1]+'</div>';
  }).join('');
}
function impostaFiltro(f) { filtro = f; render(); renderTabs(); }

async function carica() {
  document.getElementById('content').innerHTML = '<div class="loading">Caricamento…</div>';
  try {
    const [{ data, error }, { data: dataLibere, error: errLibere }] = await Promise.all([
      sb.rpc('pulizie_oggi', { p_data: dataCorrente }),
      sb.rpc('pulizie_libere', { p_data: dataCorrente })
    ]);
    if (error) throw error;
    righe = data || [];
    nLibere = errLibere ? 0 : (dataLibere || 0);
  } catch (err) {
    document.getElementById('content').innerHTML = '<div class="loading">Errore nel caricamento. Riprova tra poco.<br><span style="font-size:11px;color:#b91c1c">'+(err.message||'')+'</span></div>';
    return;
  }
  render();
}

function etichettaAllestimento(codice) {
  if (!codice) return '—';
  return codice;
}

function cardHTML(r) {
  const badgeLbl = r.categoria === 'arrivo' ? '🆕 Arriva oggi' : r.categoria === 'partenza' ? '🚪 Parte oggi' : '🛏 Ferma';
  return '<div class="card'+(r.pronta?' done':'')+'">' +
    '<div class="head">' +
      '<div><span class="room">'+r.room_name+'</span><span class="type">'+(r.room_type||'')+'</span></div>' +
      '<span class="badge '+r.categoria+'">'+badgeLbl+'</span>' +
    '</div>' +
    '<div class="row"><b>Allestimento:</b> '+etichettaAllestimento(r.allestimento)+'</div>' +
    '<div class="row"><b>Persone:</b> '+(r.persone||1)+'</div>' +
    (r.note ? '<div class="note">📝 '+r.note.replace(/</g,'&lt;')+'</div>' : '') +
    '<button class="toggle '+(r.pronta?'done':'todo')+'" onclick="toggleStato(\''+r.room_id+'\', '+(!r.pronta)+', this)">'+(r.pronta?'✅ Pronta':'🧹 Da pulire')+'</button>' +
  '</div>';
}

function render() {
  renderTabs();
  const soloDaPulire = document.getElementById('solo-da-pulire').checked;

  const uniche = {};
  righe.forEach(function(r){ uniche[r.room_id] = uniche[r.room_id] || r; });
  const listaUnica = Object.values(uniche);
  document.getElementById('count-da-pulire').textContent = listaUnica.filter(function(r){return !r.pronta;}).length;
  document.getElementById('count-pronte').textContent = listaUnica.filter(function(r){return r.pronta;}).length;

  var nArrivi = righe.filter(function(r){return r.categoria==='arrivo';}).length;
  var nPartenze = righe.filter(function(r){return r.categoria==='partenza';}).length;
  var nFermate = righe.filter(function(r){return r.categoria==='fermata';}).length;
  document.getElementById('catcounts').innerHTML =
    '<div class="catchip arrivo">🆕 Arrivi <span>'+nArrivi+'</span></div>' +
    '<div class="catchip partenza">🚪 Partenze <span>'+nPartenze+'</span></div>' +
    '<div class="catchip fermata">🛏 Ferme <span>'+nFermate+'</span></div>' +
    '<div class="catchip libere">🔵 Libere <span>'+nLibere+'</span></div>';

  let visibili = filtro==='tutti' ? righe : righe.filter(function(r){return r.categoria===filtro;});
  if (soloDaPulire) visibili = visibili.filter(function(r){return !r.pronta;});

  const el = document.getElementById('content');
  if (!visibili.length) {
    el.innerHTML = '<div class="sectiontitle">'+fmtDataIt(dataCorrente)+'</div><div class="empty">Nessuna camera da mostrare.</div>';
    return;
  }
  el.innerHTML = '<div class="sectiontitle">'+fmtDataIt(dataCorrente)+' — '+visibili.length+' camer'+(visibili.length===1?'a':'e')+'</div>' +
    visibili.map(cardHTML).join('');
}

async function toggleStato(roomId, nuovoStato, btn) {
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const { error } = await sb.rpc('pulizie_set_stato', { p_room_id: roomId, p_data: dataCorrente, p_pronta: nuovoStato });
    if (error) throw error;
    righe.forEach(function(r){ if (r.room_id === roomId) r.pronta = nuovoStato; });
    render();
  } catch (err) {
    alert('Non sono riuscito a salvare: ' + (err.message||'errore sconosciuto'));
    btn.disabled = false;
    render();
  }
}

carica();
</script>
</body>
</html>
