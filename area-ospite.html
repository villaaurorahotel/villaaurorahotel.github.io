<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a73e8">
<title>La mia prenotazione</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e5e7eb;--accent:#1a73e8;--ok:#15803d;--okbg:#e8f6ee;--bad:#b42318;--badbg:#fdeceb;--warn:#a16207;--warnbg:#fff7e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--accent);color:#fff;padding:20px 16px 34px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex-shrink:0}
.brand b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;gap:4px;flex-shrink:0}
.lang button,.ref{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.lang button.on{background:#fff;color:var(--accent)}
h1{font-size:24px;margin:18px 0 2px;line-height:1.2}
.hsub{opacity:.9;font-size:14px}
main{margin-top:-20px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.dates{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.dates .d{font-size:13px;color:var(--muted)}
.dates .v{font-size:18px;font-weight:700;color:var(--text)}
.dates .n{font-size:13px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;font-weight:600}
.row.tot{font-size:17px;font-weight:800;border-top:2px solid var(--text);margin-top:4px;padding-top:10px}
.row.tot span{color:var(--text)!important;font-weight:800}
.row.res span:last-child{color:var(--bad)}
.row.sub span{font-weight:400!important;font-size:12.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.mut{background:#eef0f3;color:var(--muted)}
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:14px 16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.dnd{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;font:inherit;text-align:left;color:var(--text)}
.dnd .ic{font-size:30px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef0f3;flex-shrink:0}
.dnd b{display:block;font-size:16px}
.dnd small{color:var(--muted);font-size:13px}
.dnd.on{border-color:var(--bad);background:var(--badbg)}
.dnd.on .ic{background:var(--bad);color:#fff}
.msg{padding:12px 14px;border-radius:11px;margin-top:10px;font-size:14px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.err{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--warnbg);color:var(--warn)}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.contacts a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:1px solid var(--line);border-radius:11px;text-decoration:none;color:var(--text);font-size:13px;font-weight:600}
.contacts a span{font-size:22px}
.center{text-align:center;padding:50px 16px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
</style>
</head>

  var s=D.struttura||{}, nReali=notti(D.checkin,D.checkout), max=parseInt(s.cityTaxMaxNights)||0, n=max>0?Math.min(nReali,max):nReali, soglia=parseInt(s.cityTaxChildAge)||0;
  var ages=(D.eta||[]).filter(function(x){return x;}), full, under;
  if (soglia>0 && ages.length){ under=0; full=0; (D.eta||[]).forEach(function(x){ var e=x?eta(x,D.checkin):null; if(e!==null && e<soglia) under++; else full++; }); }
  else { var ch=parseInt(D.bambini)||0; under=Math.max(0,Math.min(parseInt(D.bambiniEsenti)||0,ch)); full=(parseInt(D.adulti)||0)+(ch-under); }
  var calc=n*(full*(Number(s.cityTax)||0)+under*(Number(s.cityTaxChildRate)||0));
  var tax=(D.tassaManuale && D.tassaOverride!=null)?(Number(D.tassaOverride)||0):calc;
  return {tax:Math.round(tax*100)/100, n:n, full:full, under:under, rateChild:Number(s.cityTaxChildRate)||0};
}
function conto(){
  var tx=tassa(), extra=(D.extras||[]).reduce(function(s,e){return s+(Number(e.totale)||0);},0), sogg=Number(D.totale)||0;
  var co=D.contoOta||null, ota=!!(co&&co.pagatore==='ota');
  var soggOspite = ota ? (Number(co.differenza)||0) : sogg;
  var tot=soggOspite+tx.tax+extra;
  var pagatoPag=(D.pagamenti||[]).reduce(function(s,p){return s+(Number(p.importo)||0);},0);
  var giaPagato=(Number(D.caparra)||0)+pagatoPag;
  var residuo = D.pagato==='si' ? 0 : Math.max(0, Math.round((tot-giaPagato)*100)/100);
  return {tx:tx, extra:extra, sogg:sogg, ota:ota, nomeOta:(co&&co.ota)||D.fonte||'OTA', diff:ota?(Number(co.differenza)||0):0, tot:tot, caparra:Number(D.caparra)||0, pagatoPag:pagatoPag, residuo:residuo};
}
function dndAttivo(){ return !!D.dnd && D.dndAt && new Date(D.dndAt).toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'})===oggiRoma(); }

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('.lang button[data-l]').forEach(function(b){ b.classList.toggle('on', b.dataset.l===lang); });
  if(!D) return;
  var s=D.struttura||{}, c=conto(), n=notti(D.checkin,D.checkout);
  document.getElementById('s-nome').textContent = s.nome||'';
  document.title = (s.nome?s.nome+' — ':'')+t('booking');
  document.getElementById('h-ciao').textContent = t('hello')+' '+String(D.nome||'').split(' ')[0]+'!';
  document.getElementById('h-sub').textContent = t('sub');
  var stKey = {confermata:'st_confermata',attesa:'st_attesa','check-in':'st_checkin','check-out':'st_checkout'}[D.stato] || 'st_confermata';
  var stCls = D.stato==='check-in'?'ok':(D.stato==='attesa'?'warn':'mut');
  var h='';
  // Prenotazione
  h+='<div class="card"><h2>'+esc(t('booking'))+'</h2>'+
     '<div class="dates"><div><div class="d">'+esc(t('checkin'))+'</div><div class="v">'+esc(fmtD(D.checkin))+'</div></div><div class="n">'+n+' '+esc(n===1?t('night'):t('nights'))+'</div><div><div class="d">'+esc(t('checkout'))+'</div><div class="v">'+esc(fmtD(D.checkout))+'</div></div></div>'+
     '<div style="margin-top:12px">'+
     '<div class="row"><span>'+esc(t('status'))+'</span><span><span class="pill '+stCls+'">'+esc(t(stKey))+'</span></span></div>'+
     (D.tipologia?'<div class="row"><span>'+esc(t('room'))+'</span><span>'+esc(D.tipologia)+'</span></div>':'')+
     '<div class="row"><span>'+esc(t('guests'))+'</span><span>'+(parseInt(D.adulti)||1)+' '+esc((parseInt(D.adulti)||1)===1?t('adult'):t('adults'))+((parseInt(D.bambini)||0)?' + '+D.bambini+' '+esc(parseInt(D.bambini)===1?t('child'):t('children')):'')+'</span></div>'+
     (D.pensione&&T.it['board_'+D.pensione]?'<div class="row"><span>'+esc(t('board'))+'</span><span>'+esc(t('board_'+D.pensione))+'</span></div>':'')+
     '<div class="row"><span>'+esc(t('code'))+'</span><span>'+esc(D.codice||'')+'</span></div></div></div>';
  // Non disturbare
  if (D.stato==='check-in') {
    var on=dndAttivo(), ora=on?new Date(D.dndAt).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'}):'';
    h+='<div class="card"><button class="dnd'+(on?' on':'')+'" id="dnd"><span class="ic">'+(on?'🚫':'🛏️')+'</span><span><b>'+esc(t('dndT'))+'</b><small>'+esc(on?t('dndOn')+' ('+t('dndSince')+' '+ora+')':t('dndOff'))+'</small></span></button>'+
       (MSG.dnd?'<div class="msg '+MSG.dnd[0]+'">'+esc(MSG.dnd[1])+'</div>':'')+'</div>';
  }
  // Conto
  h+='<div class="card"><h2>'+esc(t('bill'))+'</h2>'+
     (c.ota ? '<div class="row"><span>'+esc(t('stay'))+'</span><span style="font-weight:400;color:var(--muted)">'+esc(t('paidBy'))+' '+esc(c.nomeOta)+'</span></div>'
            : '<div class="row"><span>'+esc(t('stay'))+'</span><span>'+eur(c.sogg)+'</span></div>')+
     (c.diff>0?'<div class="row"><span>'+esc(t('diff'))+'</span><span>'+eur(c.diff)+'</span></div>':'')+
     (D.extras||[]).map(function(e){ return '<div class="row"><span>'+esc(t('extras'))+' — '+esc(e.nome||'')+(e.qty>1?' ×'+e.qty:'')+'</span><span>'+eur(e.totale)+'</span></div>'; }).join('')+
     (c.tx.tax>0?'<div class="row"><span>'+esc(t('tax'))+'</span><span>'+eur(c.tx.tax)+'</span></div><div class="row sub" style="border-top:0;padding-top:0"><span>'+c.tx.full+' '+esc(t('taxNote').split(' ')[0])+' × '+c.tx.n+' '+esc(c.tx.n===1?t('night'):t('nights'))+(c.tx.under?' · '+c.tx.under+' '+esc(c.tx.rateChild?(c.tx.under===1?t('child'):t('children')):(c.tx.under===1?t('exempt1'):t('exempt'))):'')+'</span><span></span></div>':'')+
     '<div class="row tot"><span>'+esc(t('total'))+'</span><span>'+eur(c.tot)+'</span></div>'+
     (c.caparra>0?'<div class="row"><span>'+esc(t('deposit'))+'</span><span>− '+eur(c.caparra)+'</span></div>':'')+
     (c.pagatoPag>0?'<div class="row"><span>'+esc(t('paid'))+'</span><span>− '+eur(c.pagatoPag)+'</span></div>':'')+
     (c.residuo>0?'<div class="row res"><span>'+esc(t('due'))+'</span><span>'+eur(c.residuo)+'</span></div>':'<div class="msg ok" style="text-align:center;font-weight:700">✓ '+esc(t('settled'))+'</div>');
  if (c.residuo>0 && (s.paypal||s.sumup)) {
    var ps=D.pagamentoSegnalato;
    if (ps && !MSG.pag) h+='<div class="msg info">'+esc(t('paidAlready'))+' '+eur(ps.importo)+' — '+esc(t('paidAlready2'))+'</div>';
    if (s.paypal) h+='<a class="btn" id="pp" target="_blank" rel="noopener" href="https://paypal.me/'+encodeURIComponent(s.paypal)+'/'+c.residuo.toFixed(2)+'EUR">'+esc(t('pay'))+' '+eur(c.residuo)+' '+esc(t('payWith'))+'</a>';
    if (s.sumup) h+='<a class="btn sec" id="su" target="_blank" rel="noopener" href="'+esc(s.sumup)+'">'+esc(t('payCard'))+'</a>';
    if (s.paypal) h+='<div style="font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px">'+esc(t('payHint'))+'</div>';
    if (ATTESA_PAG && !MSG.pag) h+='<div style="margin-top:12px;text-align:center;font-weight:600">'+esc(t('paidQ'))+'</div><button class="btn sec" id="hopagato">'+esc(t('paidBtn'))+'</button>';
  }
  if (MSG.pag) h+='<div class="msg '+MSG.pag[0]+'">'+esc(MSG.pag[1])+'</div>';
  h+='</div>';
  // Check-in online, guida
  if ((D.stato==='confermata'||D.stato==='attesa') && s.checkinOnline)
    h+='<div class="card"><h2>'+esc(t('checkinOnline'))+'</h2><div style="font-size:14px;color:var(--muted)">'+esc(t('checkinTxt'))+'</div><a class="btn" href="'+esc(s.checkinOnline.replace(/\?.*$/,'')+'?token='+encodeURIComponent(token))+'">'+esc(t('checkinOnline'))+'</a></div>';
  if (s.guida) h+='<div class="card"><h2>'+esc(t('guide'))+'</h2><div style="font-size:14px;color:var(--muted)">'+esc(t('guideTxt'))+'</div><a class="btn sec" target="_blank" rel="noopener" href="'+esc(s.guida)+'">📖 '+esc(t('guide'))+'</a></div>';
  // Contatti
  var tel=String(s.telefono||'').replace(/[^0-9+]/g,''), wa=tel.replace(/[^0-9]/g,''); if (wa && wa.length<=10) wa='39'+wa;
  var addr=[s.indirizzo,s.citta].filter(Boolean).join(', ');
  var cont='';
  if (tel) cont+='<a href="tel:'+esc(tel)+'"><span>📞</span>'+esc(t('call'))+'</a><a href="https://wa.me/'+esc(wa)+'" target="_blank" rel="noopener"><span>💬</span>'+esc(t('whatsapp'))+'</a>';
  if (s.email) cont+='<a href="mailto:'+esc(s.email)+'"><span>✉️</span>'+esc(t('email'))+'</a>';
  if (addr) cont+='<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((s.nome?s.nome+', ':'')+addr)+'" target="_blank" rel="noopener"><span>📍</span>'+esc(t('map'))+'</a>';
  if (cont) h+='<div class="card"><h2>'+esc(t('contact'))+'</h2><div class="contacts">'+cont+'</div>'+(addr?'<div style="font-size:13px;color:var(--muted);text-align:center;margin-top:10px">'+esc(addr)+'</div>':'')+'</div>';
  h+='<div class="foot">'+esc(t('upd'))+' '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'</div>';
  document.getElementById('app').innerHTML=h;
  var dnd=document.getElementById('dnd'); if (dnd) dnd.onclick=toggleDnd;
  var pp=document.getElementById('pp'), su=document.getElementById('su');
  [pp,su].forEach(function(a){ if(a) a.addEventListener('click', function(){ setTimeout(function(){ ATTESA_PAG=true; render(); }, 400); }); });
  var hp=document.getElementById('hopagato'); if (hp) hp.onclick=segnalaPagamento;
}
function toggleDnd(){
  var nuovo=!dndAttivo(), btn=document.getElementById('dnd'); btn.disabled=true;
  rpc('ao_set_dnd',{p_token:token,p_on:nuovo}).then(function(r){
    if(!r||r.ok===false) throw new Error('x');
    D.dnd=nuovo; D.dndAt=new Date().toISOString(); MSG.dnd=['ok', nuovo?t('dndSet'):t('dndUnset')]; render();
  }).catch(function(){ MSG.dnd=['err',t('dndErr')]; render(); });
}
function segnalaPagamento(){
  var c=conto(), btn=document.getElementById('hopagato'); btn.disabled=true;
  rpc('ao_segnala_pagamento',{p_token:token,p_importo:c.residuo,p_metodo:'PayPal / carta online'}).then(function(r){
    if(!r||r.ok===false) throw new Error('x');
    D.pagamentoSegnalato={importo:c.residuo}; MSG.pag=['ok',t('paidOk')]; render();
    if (CFG.emailStruttura) fetch(CFG.url.replace(/\/$/,'')+'/functions/v1/invio-ricevuta',{method:'POST',headers:{'Content-Type':'application/json','apikey':CFG.key,'Authorization':'Bearer '+CFG.key},
      body:JSON.stringify({to:CFG.emailStruttura,toName:(D.struttura||{}).nome||'',subject:'💳 Pagamento online segnalato — '+(D.nome||''),
        message:(D.nome||'')+' segnala di aver pagato '+eur(c.residuo)+' online (PayPal/carta) per il soggiorno dal '+D.checkin+' al '+D.checkout+'.\n\nVerifica l\'incasso e registralo nel Conto della prenotazione in DeskFlow.'})}).catch(function(){});
  }).catch(function(){ MSG.pag=['err',t('neterr')]; render(); });
}
function carica(){
  var app=document.getElementById('app');
  if(!D) app.innerHTML='<div class="card center">'+esc(t('loading'))+'</div>';
  if(!token){ app.innerHTML='<div class="card center">'+esc(t('invalid'))+'</div>'; return; }
  rpc('ao_get',{p_token:token}).then(function(d){
    if(!d){ app.innerHTML='<div class="card center">'+esc(t('invalid'))+'</div>'; return; }
    if(d.cancellata){ app.innerHTML='<div class="card center">'+esc(t('cancelled'))+'</div>'; return; }
    D=d; render();
  }).catch(function(){ if(!D) app.innerHTML='<div class="card center">'+esc(t('neterr'))+'</div>'; });
}
document.querySelectorAll('.lang button[data-l]').forEach(function(b){ b.onclick=function(){ lang=b.dataset.l; MSG={}; if(D) render(); else carica(); }; });
document.getElementById('ref').onclick=function(){ MSG={}; carica(); };
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && D) carica(); });
carica();
</script>
</body>
