<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Greta's House">
<link rel="manifest" href="manifest-ospite.json">
<link rel="apple-touch-icon" href="icona-ospite-192.png">
<link rel="icon" type="image/png" href="icona-ospite-192.png">
<title>Greta's House</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e5e7eb;--accent:#1a73e8;--ok:#15803d;--okbg:#e8f6ee;--bad:#b42318;--badbg:#fdeceb;--warn:#a16207;--warnbg:#fff7e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--accent);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 30px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex-shrink:0}
.brand b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:4px;flex-shrink:0}
.tools button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tools button.on{background:#fff;color:var(--accent)}
h1{font-size:23px;margin:16px 0 2px;line-height:1.2}
.hsub{opacity:.9;font-size:14px}
main{margin-top:-18px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.dates{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.dates .d{font-size:13px;color:var(--muted)}.dates .v{font-size:18px;font-weight:700}
.dates .n{font-size:13px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;font-weight:600}
.row.tot{font-size:17px;border-top:2px solid var(--text);margin-top:4px;padding-top:10px}
.row.tot span{color:var(--text)!important;font-weight:800}
.row.res span:last-child{color:var(--bad)}
.row.sub span{font-weight:400!important;font-size:12.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.mut{background:#eef0f3;color:var(--muted)}
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:14px 16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13.5px;margin:8px 8px 0 0}
.btn:disabled{opacity:.6}
.dnd{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;font:inherit;text-align:left;color:var(--text)}
.dnd .ic{font-size:30px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef0f3;flex-shrink:0}
.dnd b{display:block;font-size:16px}.dnd small{color:var(--muted);font-size:13px}
.dnd.on{border-color:var(--bad);background:var(--badbg)}.dnd.on .ic{background:var(--bad);color:#fff}
.msg{padding:12px 14px;border-radius:11px;margin-top:10px;font-size:14px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.err{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--warnbg);color:var(--warn)}
.wifi{display:flex;flex-direction:column;gap:8px}
.wifi .w{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f6f7f9;border-radius:10px;padding:10px 12px}
.wifi .w small{display:block;color:var(--muted);font-size:12px}.wifi .w b{font-size:16px;word-break:break-all}
.copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--accent);flex-shrink:0}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.item .e{font-size:26px;width:34px;text-align:center;flex-shrink:0}
.item b{display:block;font-size:15.5px}
.item p{margin:3px 0 0;color:#4b5563;font-size:14px}
.item .dist{color:var(--muted);font-size:12.5px;margin-top:3px}
.rule{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}.rule:first-of-type{border-top:0}
details{border-top:1px solid var(--line);padding:10px 0}details:first-of-type{border-top:0}
summary{font-weight:700;cursor:pointer;font-size:15px}
details div{color:#4b5563;font-size:14px;margin-top:8px;white-space:pre-line}
.contact{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.contact:first-of-type{border-top:0}
.contact .e{font-size:22px;width:30px;text-align:center}
.contact .t{flex:1;min-width:0}.contact .t b{display:block;font-size:15px}.contact .t small{color:var(--muted);font-size:13px}
.contact a{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;white-space:nowrap}
.install{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.install .e{font-size:26px}.install div{flex:1;font-size:13.5px}.install b{display:block;font-size:15px}
.install button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}
.install .x{background:none;color:var(--muted);padding:4px;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:620px;width:100%}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:21px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:700}
.center{text-align:center;padding:40px 16px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.off{background:var(--warnbg);color:var(--warn);text-align:center;font-size:12.5px;padding:6px;border-radius:8px;margin-bottom:10px}
</style>
</head>

function tassa(){
  var s=D.struttura||{}, nR=notti(D.checkin,D.checkout), max=parseInt(s.cityTaxMaxNights)||0, n=max>0?Math.min(nR,max):nR, soglia=parseInt(s.cityTaxChildAge)||0, full, under;
  var ages=(D.eta||[]).filter(function(x){return x;});
  if (soglia>0 && ages.length){ under=0; full=0; (D.eta||[]).forEach(function(x){ var e=x?eta(x,D.checkin):null; if(e!==null&&e<soglia) under++; else full++; }); }
  else { var ch=parseInt(D.bambini)||0; under=Math.max(0,Math.min(parseInt(D.bambiniEsenti)||0,ch)); full=(parseInt(D.adulti)||0)+(ch-under); }
  var calc=n*(full*(Number(s.cityTax)||0)+under*(Number(s.cityTaxChildRate)||0));
  var tax=(D.tassaManuale&&D.tassaOverride!=null)?(Number(D.tassaOverride)||0):calc;
  return {tax:Math.round(tax*100)/100,n:n,full:full,under:under,rateChild:Number(s.cityTaxChildRate)||0};
}

  var pag=(D.pagamenti||[]).reduce(function(s,p){return s+(Number(p.importo)||0);},0), gia=(Number(D.caparra)||0)+pag;
  return {tx:tx,extra:extra,sogg:sogg,ota:ota,nomeOta:(co&&co.ota)||D.fonte||'OTA',diff:ota?(Number(co.differenza)||0):0,tot:tot,caparra:Number(D.caparra)||0,pag:pag,
          residuo:D.pagato==='si'?0:Math.max(0,Math.round((tot-gia)*100)/100)};

function carica(){
  if (!D && !G) document.getElementById('app').innerHTML='<div class="card center">'+esc(t('loading'))+'</div>';
  var p = token ? rpc('ao_get',{p_token:token}) : rpc('ao_guida',{});
  p.then(function(d){
    OFFLINE_AT=null; ERR=null;
    if (token) {
      if (!d) { ERR=t('invalid'); store('ao_token',null); token=''; return rpc('ao_guida',{}).then(function(g){ G=g; render(); }); }
      if (d.cancellata) { ERR=t('cancelled'); D=null; return rpc('ao_guida',{}).then(function(g){ G=g; render(); }); }
      D=d; store('ao_cache_d', JSON.stringify({at:Date.now(), d:d}));
    } else { G=d; store('ao_cache_g', JSON.stringify({at:Date.now(), d:d})); }
    render();
  }).catch(function(){
    // senza rete: mostra l'ultima copia salvata sul telefono
    var c = JSON.parse(store(token?'ao_cache_d':'ao_cache_g')||'null');
    if (c && c.d) { if (token) D=c.d; else G=c.d; OFFLINE_AT=c.at; render(); }
    else document.getElementById('app').innerHTML='<div class="card center">'+esc(t('neterr'))+'</div>';
  });
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='visible' && (D||G)) carica(); });
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('sw-ospite.js').catch(function(){});
render(); carica();
</script>
</body>
</html>
